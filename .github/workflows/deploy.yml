name: Job Portal CI/CD

# Required GitHub Secrets:
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_REGISTRY
# EC2_HOST, EC2_USERNAME, EC2_SSH_KEY
# MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD, JWT_SECRET
# TARGET_GROUP_ARN, ALB_DNS_NAME (only needed for jobs 5-6)
# NOTE: MYSQL_* secrets must match what's actually set in the live MySQL container.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_REGISTRY }}
  ECR_REPOSITORY_BACKEND: backend
  ECR_REPOSITORY_FRONTEND: frontend
  DEPLOY_DIR: /opt/job-portal

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: ./job-portal/backend/package-lock.json
      - working-directory: ./job-portal/backend
        run: npm install
      - working-directory: ./job-portal/backend
        run: npm test --if-present

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: ./job-portal/frontend/package-lock.json
      - working-directory: ./job-portal/frontend
        run: npm install
      - working-directory: ./job-portal/frontend
        run: npm test -- --watchAll=false --passWithNoTests

  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./job-portal/backend
            repo: backend
          - service: frontend
            context: ./job-portal/frontend
            repo: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build image
        working-directory: ${{ matrix.context }}
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:latest .
      - name: Push image
        working-directory: ${{ matrix.context }}
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:latest

  deploy-to-ec2:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH key
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Ensure deploy dir exists
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$USER@$HOST" \
            "sudo mkdir -p ${{ env.DEPLOY_DIR }} && sudo chown -R \$(whoami):\$(whoami) ${{ env.DEPLOY_DIR }}"
      - name: Sync repo to EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$USER@$HOST" \
            "REPO_URL='$REPO_URL' DEPLOY_DIR='${{ env.DEPLOY_DIR }}' bash -c '
              if [ -d \"\$DEPLOY_DIR/.git\" ]; then
                cd \"\$DEPLOY_DIR\" && git fetch origin main && git reset --hard origin/main && git clean -fd
              else
                rm -rf \"\$DEPLOY_DIR\"/* \"\$DEPLOY_DIR\"/.[!.]* 2>/dev/null || true
                git clone --branch main \"\$REPO_URL\" \"\$DEPLOY_DIR\"
              fi'"
      - name: Write .env and copy to EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
        run: |
          cat > .env.deploy <<EOF
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          NODE_ENV=production
          REACT_APP_API_URL=/api
          NGINX_PORT=80
          ECR_REGISTRY=${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY_BACKEND=backend
          ECR_REPOSITORY_FRONTEND=frontend
          IMAGE_TAG=${{ github.sha }}
          EOF
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no .env.deploy "$USER@$HOST:${{ env.DEPLOY_DIR }}/.env"
          rm -f .env.deploy
      - name: Run deploy script on EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$USER@$HOST" \
            "chmod +x '${{ env.DEPLOY_DIR }}/scripts/deploy-remote.sh' && \
             AWS_REGION='${{ env.AWS_REGION }}' bash '${{ env.DEPLOY_DIR }}/scripts/deploy-remote.sh'"

  register-target-group:
    needs: deploy-to-ec2
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve EC2 instance ID
        id: resolve-instance
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for FILTER in "ip-address" "private-ip-address" "dns-name"; do
            ID=$(aws ec2 describe-instances \
              --filters "Name=$FILTER,Values=$EC2_HOST" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
            if [ -n "$ID" ] && [ "$ID" != "None" ]; then
              echo "instance_id=$ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ERROR: Could not resolve EC2 instance ID for $EC2_HOST"
          exit 1
      - name: Register with target group
        run: |
          aws elbv2 register-targets --target-group-arn "${{ secrets.TARGET_GROUP_ARN }}" \
            --targets Id=${{ steps.resolve-instance.outputs.instance_id }},Port=80
      - name: Wait until healthy
        run: |
          aws elbv2 wait target-in-service --target-group-arn "${{ secrets.TARGET_GROUP_ARN }}" \
            --targets Id=${{ steps.resolve-instance.outputs.instance_id }},Port=80

  verify-deployment:
    needs: register-target-group
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check target group health
        run: aws elbv2 describe-target-health --target-group-arn "${{ secrets.TARGET_GROUP_ARN }}" --output table
      - name: Curl ALB endpoint
        run: |
          curl -f "http://${{ secrets.ALB_DNS_NAME }}/healthz" || (echo "ALB health check failed" && exit 1)
      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Commit SHA** | \`${{ github.sha }}\` |"
            echo "| **EC2 Host** | ${{ secrets.EC2_HOST }} |"
            echo "| **ALB DNS** | ${{ secrets.ALB_DNS_NAME }} |"
            echo "| **Backend Image** | ${{ env.ECR_REGISTRY }}/backend |"
            echo "| **Frontend Image** | ${{ env.ECR_REGISTRY }}/frontend |"
            echo "| **Nginx Image** | nginx:1.27-alpine |"
            echo "| **Services Deployed** | backend, frontend, nginx |"
            echo "| **Status** | Completed |"
          } >> $GITHUB_STEP_SUMMARY
