version: "3.9"

# =====================================================================
# Job Portal - full stack
#   mysql     -> MySQL 8 database with a persisted volume
#   backend   -> Node.js/Express REST API (JWT auth, jobs, applications)
#   frontend  -> React SPA, built and served by its own internal Nginx
#   nginx     -> public-facing reverse proxy in front of frontend/backend
#
# Run with:  docker compose up -d --build
# =====================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: job-portal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_super_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-job_portal}
      MYSQL_USER: ${MYSQL_USER:-job_portal_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-job_portal_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_super_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-portal-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: ${BACKEND_PORT:-5000}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret_string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_DIR: /app/uploads
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-job_portal}
      DB_USER: ${MYSQL_USER:-job_portal_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-job_portal_pass}
    volumes:
      - resume_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    container_name: job-portal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: job-portal-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  job-portal-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  resume_uploads:
    driver: local
