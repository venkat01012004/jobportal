# =====================================================================
# Job Portal - top-level reverse proxy
# Routes:
#   /            -> frontend container (React static build)
#   /api/*       -> backend container (Express API)
#   /uploads/*   -> blocked (resume downloads are served through the
#                   authenticated /api/applications/:id/resume route,
#                   never directly from disk)
# =====================================================================

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:5000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ---------- Reverse proxy health check ----------
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- Backend API ----------
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- Frontend (React SPA) ----------
    location / {
        proxy_pass http://frontend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never allow direct filesystem access to uploaded resumes.
    location /uploads/ {
        deny all;
        return 403;
    }
}
