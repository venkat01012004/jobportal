version: "3.9"

# =====================================================================
# Job Portal - production compose file, used on the EC2 host.
# Unlike docker-compose.yml (which builds images locally), this pulls
# pre-built images pushed to ECR by the GitHub Actions pipeline.
#
# Expects a .env file (deployed by the pipeline) providing:
#   ECR_REGISTRY, ECR_REPOSITORY, IMAGE_TAG,
#   MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD,
#   JWT_SECRET, JWT_EXPIRES_IN, NGINX_PORT
#
# Run with:  docker compose -f docker-compose.prod.yml up -d
# =====================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: job-portal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./job-portal/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:backend-${IMAGE_TAG}
    container_name: job-portal-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_DIR: /app/uploads
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - resume_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:frontend-${IMAGE_TAG}
    container_name: job-portal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:nginx-${IMAGE_TAG}
    container_name: job-portal-nginx
    restart: unless-stopped
    ports:
      # ALB target group forwards HTTP traffic here on port 80
      - "${NGINX_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  job-portal-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  resume_uploads:
    driver: local
