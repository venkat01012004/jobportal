version: "3.9"

# =====================================================================
# Job Portal - production compose file, used on the EC2 host.
# Unlike docker-compose.yml (which builds images locally), this pulls
# pre-built images pushed to ECR by the GitHub Actions pipeline.
#
# Expects a .env file (deployed by the pipeline) providing:
#   ECR_REGISTRY, ECR_REPOSITORY_BACKEND, ECR_REPOSITORY_FRONTEND, IMAGE_TAG,
#   MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD,
#   JWT_SECRET, JWT_EXPIRES_IN, NGINX_PORT
#
# nginx uses the public nginx:1.27-alpine image directly, with
# job-portal/nginx/nginx.conf bind-mounted in from the synced repo --
# no separate ECR repo or build needed for it since it's just a
# reverse proxy with no custom code.
#
# Run with:  docker compose -f docker-compose.prod.yml up -d
# =====================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: job-portal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./job-portal/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_BACKEND}:${IMAGE_TAG}
    container_name: job-portal-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_DIR: /app/uploads
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - resume_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_FRONTEND}:${IMAGE_TAG}
    container_name: job-portal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - job-portal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: job-portal-nginx
    restart: unless-stopped
    ports:
      # ALB target group forwards HTTP traffic here on port 80
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./job-portal/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - job-portal-network
    healthcheck:
      # Plain-alpine nginx has no curl/wget installed, so use busybox ash's
      # /dev/tcp for a lightweight port-open check instead of an HTTP GET.
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  job-portal-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  resume_uploads:
    driver: local
